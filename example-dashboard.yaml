# Example Lovelace dashboard for the HearthLike cards.
# Replace the calendar entities with your own. The calendar cards need a view with a fixed height,
# so use a panel view (one card per view) or a sections/grid layout.
title: HearthLike Example
views:
  # The whole wall display in one card: weather + clock, people badges, the calendar, quick buttons.
  - title: Home
    path: home
    panel: true
    cards:
      - type: custom:hearthlike-dashboard-card
        weather: weather.home
        weather_tap_action:      # optional; default is the entity's more-info popup
          action: navigate       # more-info | navigate | url | call-service | none
          navigation_path: /lovelace/forecast
        clock:
          military: false
        people:
          - entity: person.alex
            color: "#b82d3d"
          - entity: person.sam
            color: "#1badf8"
        calendar:                # same options as hearthlike-calendar-card below
          day:
            visible_hours: 10
            columns:
              - name: Family
                color: "#378ADD"
                entities: [calendar.family]
          week:
            calendars:
              - entity: calendar.family
                color: "#378ADD"
          month:
            calendars:
              - entity: calendar.family
                color: "#378ADD"
        buttons:
          - entity: light.family_room
          - entity: light.kitchen
            name: Kitchen
          - entity: switch.tv
            show_state: true

  # All-in-one: Day / Weekly / Monthly tabs plus a floating "+" add-event button.
  - title: Calendar
    path: calendar
    panel: true
    cards:
      - type: custom:hearthlike-calendar-card
        default_view: day        # day | week | month
        idle_timeout: 120        # seconds of inactivity before returning to default_view and today (0 = off)
        day:
          columns:               # one column per person
            - name: Family
              color: "#378ADD"
              entities: [calendar.family]
              icon: mdi:home           # optional small icon before event titles (see README)
            - name: Kids
              color: "#E67E22"
              entities: [calendar.kids]
        week:
          calendars:
            - entity: calendar.family
              color: "#378ADD"
            - entity: calendar.kids
              color: "#E67E22"
        month:
          calendars:
            - entity: calendar.family
              color: "#378ADD"
            - entity: calendar.kids
              color: "#E67E22"
        fab:
          calendars: [calendar.family, calendar.kids]   # omit to offer every calendar

  # The same views as separate cards.
  - title: Day
    path: day
    panel: true
    cards:
      - type: custom:hearthlike-day-card
        hour_start: 0
        hour_end: 24
        visible_hours: 10
        columns:
          - name: Family
            color: "#378ADD"
            entities: [calendar.family]

  - title: Week
    path: week
    panel: true
    cards:
      - type: custom:hearthlike-week-card
        hour_start: 0
        hour_end: 24
        px_per_hour: 64
        calendars:
          - entity: calendar.family
            color: "#378ADD"

  - title: Month
    path: month
    panel: true
    cards:
      - type: custom:hearthlike-month-card
        calendars:
          - entity: calendar.family
            color: "#378ADD"

  # A standalone add-event button.
  - title: Add event
    path: fab
    cards:
      - type: custom:hearthlike-fab-card
        calendars: [calendar.family]
